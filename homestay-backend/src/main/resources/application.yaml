spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: homestay-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/homestayv4?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 42MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  storage:
    upload-dir: storage/uploads
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000        # 1 giờ
    refresh-token-expiration-ms: 604800000     # 7 ngày
  mail:
    from: ${MAIL_FROM:}
    sender-name: Homestay Booking System
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    vn.edu.hust.homestay: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
